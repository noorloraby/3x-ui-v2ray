services:
  3xui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    tty: true
    volumes:
      - xui-db:/etc/x-ui
      - xui-cert:/root/cert
      - xui-logs:/var/log/x-ui
    environment:
      TZ: "${TZ:-Asia/Riyadh}"
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "${XUI_ENABLE_FAIL2BAN:-false}"
      XUI_DB_FOLDER: /etc/x-ui
      XUI_LOG_FOLDER: /var/log/x-ui

volumes:
  xui-db:
  xui-cert:
  xui-logs:
