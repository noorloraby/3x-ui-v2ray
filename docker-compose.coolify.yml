services:
  3xui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    tty: true
    expose:
      - "2053"
    ports:
      - "2053:2053/tcp"
      - "2096:2096/tcp"
      # Add every VPN inbound port here before using it in 3x-ui.
      # Examples:
      # - "443:443/tcp"
      # - "443:443/udp"
      # - "8443:8443/tcp"
    volumes:
      - xui-db:/etc/x-ui
      - xui-cert:/root/cert
      - xui-logs:/var/log/x-ui
    environment:
      - TZ=${TZ:-Asia/Riyadh}
      - XRAY_VMESS_AEAD_FORCED=false
      - XUI_ENABLE_FAIL2BAN=${XUI_ENABLE_FAIL2BAN:-false}
      - XUI_DB_FOLDER=/etc/x-ui
      - XUI_LOG_FOLDER=/var/log/x-ui
      - SERVICE_FQDN_3XUI_2053

volumes:
  xui-db:
  xui-cert:
  xui-logs:
